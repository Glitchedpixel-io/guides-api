[project]
name = "guides-api"
dynamic = ["version"]
description = "TODO"
requires-python = ">=3.13,<3.15"
dependencies = ["fastapi", "uvicorn", "pydantic-settings", "logfire"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "mypy", "black", "httpx"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version comes from the nearest v*.*.* git tag. Never hardcode it.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"
markers = [
    "integration: requires external services (deselect with '-m \"not integration\"')",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.13"
files = ["app"]

[tool.black]
target-version = ["py313"]
