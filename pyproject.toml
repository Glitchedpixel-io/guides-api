[project]
name = "guides-api"
dynamic = ["version"]
description = "Authoring and PDF rendering service for illustrated how-to guides"
authors = [
    {name = "Philip Shaw", email = "philip@virorum.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.124.0,<0.125.0",
    "uvicorn[standard]>=0.38.0,<0.39.0",
    "pydantic>=2.12.4,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "python-multipart>=0.0.20,<0.1.0",
    "httpx>=0.28.1,<0.29.0",
    "sqlalchemy[asyncio]>=2.0.44,<3.0.0",
    "alembic>=1.17.0,<2.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "logfire[fastapi,sqlalchemy]>=4.15.1,<5.0.0",
    # Rendering: WeasyPrint turns the flattened Claude Design template into a PDF,
    # Jinja2 builds the HTML, segno draws the support QR without a native dependency.
    "weasyprint>=66.0",
    "jinja2>=3.1.4,<4.0.0",
    "segno>=1.6.1,<2.0.0",
    # Sketch redraw. Claude has vision input and emits the house-style SVG as text.
    "anthropic>=0.75.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version comes from the nearest v*.*.* git tag. Never hardcode it.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "mypy>=1.18.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.9.0",
    # Integration tests read the rendered PDF back and assert its text landed.
    "pypdf>=5.1.0",
    "fonttools>=4.63.0",
]

[tool.mypy]
python_version = "3.13"
plugins = [
  "pydantic.mypy"
]
files = ["app"]
exclude = [
  "tests/.*",
]

# Strictness
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

# Tolerate libraries without stubs
ignore_missing_imports = true

show_error_codes = true
pretty = true

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B904", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Star re-exports are the point of the schemas package index.
"app/schemas/__init__.py" = ["F403", "F405"]
# `Depends()` in a parameter default is the FastAPI idiom, not a mutable-default bug.
"app/routers/*.py" = ["B008"]
"app/dependencies.py" = ["B008"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers --strict-config --color=yes --durations=10 --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=85"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
xfail_strict = true

# Register markers so pytest 8 doesn't warn; descriptions double as docs.
markers = [
  "unit: fast, no I/O; mock repositories/services at protocol boundaries",
  "api: FastAPI layer with dependency overrides and httpx ASGI transport",
  "integration: requires external services (deselect with '-m \"not integration\"')",
  "live_model: hits the real Anthropic API; costs money, never in the CI gate",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

filterwarnings = [
  "error::DeprecationWarning",
  "ignore:pkg_resources is deprecated.*",
  "ignore::logfire._internal.config.LogfireNotConfiguredWarning",
]

[tool.coverage.run]
relative_files = true
omit = [
  "app/main.py",
  "app/dependencies.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
