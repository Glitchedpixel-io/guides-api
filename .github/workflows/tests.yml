name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  # The job id `test` IS the required status check. Do not rename it.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: guides_api_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/guides_api_test
      GD_DATABASE_REQUIRE_MIGRATION_HEAD: "false"
      # Never call the model from CI. The redraw client is exercised against a faked SDK;
      # a live call would spend money and turn a provider hiccup into a red build.
      GD_SKETCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7

      # WeasyPrint renders through Pango and Cairo, which are C libraries rather than
      # wheels. Without these the import succeeds and the first render fails, so the
      # failure would land in the test run rather than in setup.
      - name: Install WeasyPrint's native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            libcairo2 libgdk-pixbuf-2.0-0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Check formatting (black)
        run: uv run black --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy

      # Migrations must build the schema from nothing and match the models. The second
      # pass, after dropping the schema, is a regression guard: env.py must commit the
      # autobegun transaction before Alembic starts its own, or every migration is
      # silently rolled back while alembic still reports success (control-api#301).
      - name: Migrations build from scratch and match the models
        env:
          ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/migcheck
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'DROP DATABASE IF EXISTS migcheck'
          psql -h localhost -U postgres -c 'CREATE DATABASE migcheck'
          uv run alembic upgrade head
          uv run alembic check
          psql -h localhost -U postgres -d migcheck -c 'DROP SCHEMA gd CASCADE; CREATE SCHEMA gd;'
          uv run alembic upgrade head
          uv run alembic check

      # The whole suite, including the integration tier: Postgres is available here, and
      # the coverage floor is set against the full run.
      - name: Run tests
        run: >-
          uv run pytest tests/ -v --tb=short
          --cov=app --cov-report=xml --cov-report=term-missing
          --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: "${{ secrets.CODECOV_TOKEN }}"
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test results
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          report_type: test_results
          token: "${{ secrets.CODECOV_TOKEN }}"
          files: ./junit.xml
